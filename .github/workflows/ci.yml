name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Frontend — TypeScript check + production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Python — ai_engine tests + backend import check
  # ---------------------------------------------------------------------------
  python:
    name: Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai_engine/requirements.txt
            backend/requirements.txt

      - name: Install ai_engine dependencies
        run: pip install -r ai_engine/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ai_engine tests
        run: pytest ai_engine/tests/ -v --tb=short

      - name: Verify backend imports
        working-directory: backend
        run: |
          PYTHONPATH="${{ github.workspace }}" python -c "
          from app.main import app
          print(f'FastAPI app loaded: {app.title}')
          "
